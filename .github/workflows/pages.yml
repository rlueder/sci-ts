name: Pages

# The site (docs as pages, hello in the player), published to GitHub Pages. Run by hand,
# from the Actions tab, once Pages is enabled for the repository (Settings > Pages > Source:
# GitHub Actions). Music needs a SoundFont in assets/soundfonts, which isn't in the
# repository: without one, the game plays silently.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm game site games/hello out/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
