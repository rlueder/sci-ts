name: Games

# Every game in games/ builds (CI's tests play hello; this catches the others).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build every game
        run: |
          for game in games/*/; do
            if [ -e "$game/scripts/0.sc" ] || [ -e "$game/scripts/0.sca" ]; then pnpm game build "$game"; fi
          done
