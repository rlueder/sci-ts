name: CI

# Every pull request and push: typecheck, tests, commit messages.
# Pushes to main also release: semantic-release reads the commits since the last tag and,
# if any of them calls for a new version and the package's files changed, writes
# CHANGELOG.md and package.json, commits them as `chore(release): vX.Y.Z [skip ci]`, tags
# that commit and makes the GitHub release (release.config.js). The publish job then
# builds the package from that commit and puts it on npm.
#
# npm trusts this workflow (trusted publishing, OIDC), in the npm-publish environment, so
# there is no npm token. That trust names this file, which is why publishing a tag by hand
# (when a release's publish didn't finish) is here too:
#
#   gh workflow run ci.yml -f tag=v0.3.0
#
# publish-watch.yml checks every day that npm and the tags agree.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish to npm (e.g. v0.3.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write # npm's trusted publishing, and provenance

# Only pull requests are cancelled. A run on main that is cancelled between the release and
# the publish leaves a tag with nothing on npm.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      # Only what goes into the package makes a release: a feat in games/ or docs/ alone
      # doesn't. Compared with the last tag, not with this push, so a release a cancelled or
      # failed run missed is made by the next one.
      - name: Package changed since the last release
        id: changes
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          if git diff --name-only "$last" HEAD | grep -qE '^(packages|tools|lib|apps/viewer)/|^(package\.json|README\.md|LICENSE)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing in the package changed since $last: no release."
          fi
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: steps.changes.outputs.changed == 'true'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.changes.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: semantic-release
        id: release
        if: steps.changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          pnpm exec semantic-release
          after=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          if [ "$after" != "$before" ]; then
            {
              echo "released=true"
              echo "version=${after#v}"
              echo "sha=$(git rev-parse HEAD)"
            } >> "$GITHUB_OUTPUT"
          fi

  # After a release, or by hand for a tag. Builds the package from that commit and publishes
  # it, unless the version is already on npm.
  publish:
    needs: release
    if: >-
      always() && (needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Add required reviewers to this environment (Settings → Environments → npm-publish) to
    # approve each publish by hand; without them it doesn't wait.
    environment: npm-publish
    env:
      REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release.outputs.sha }}
      WANTED: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.REF }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      - name: Publish
        working-directory: out/package
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$version" != "${WANTED#v}" ]; then
            echo "::error::$REF builds $version, not ${WANTED#v}"
            exit 1
          fi
          if npm view "sci2-ts@$version" version >/dev/null 2>&1; then
            echo "sci2-ts@$version is already on npm."
          else
            npm publish --provenance --access public
          fi
